name: Publish frontend to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      rollback:
        description: Restore the frontend from production-before-teacher-mode-03
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.rollback && 'refs/tags/production-before-teacher-mode-03' || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the production classroom service
        if: ${{ !inputs.rollback }}
        env:
          TEACHER_API_BASE_URL: ${{ vars.TEACHER_API_BASE_URL || 'https://korean-stickman.onrender.com' }}
        run: |
          curl --fail --silent --show-error --retry 2 --retry-max-time 60 --max-time 30 "$TEACHER_API_BASE_URL/teacher-api/health" |
            jq -e '.ok == true and .service == "teacher-mode" and .version == "0.3.0"'
      - run: npm run build:pages
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://korean-stickman.onrender.com' }}
          NETLIFY_API_BASE_URL: ${{ vars.NETLIFY_API_BASE_URL || 'https://incandescent-lollipop-01828a.netlify.app' }}
          VERCEL_API_BASE_URL: ${{ vars.VERCEL_API_BASE_URL || 'https://korean-stickman.vercel.app' }}
          AMVERA_API_BASE_URL: ${{ vars.AMVERA_API_BASE_URL || 'https://korean-stickman-averanges.msk1.amvera.tech' }}
          TEACHER_API_BASE_URL: ${{ vars.TEACHER_API_BASE_URL || 'https://korean-stickman.onrender.com' }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
